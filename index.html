<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f9">
<title>高校数学</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <header class="site-head">
    <h1>内容別問題表示機能</h1>
  </header>

  <section id="setup" class="card" aria-label="出題条件">
    <form id="condition-form">
      <label class="field">単元
        <select id="unit-select" disabled></select>
      </label>
      <label class="field">詳細内容
        <select id="topic-select" disabled></select>
      </label>
      <label class="field">難易度
        <select id="difficulty-select" disabled></select>
      </label>
      <button type="submit" id="fetch-btn" disabled>問題を表示</button>
    </form>
  </section>

  <div id="message" role="status" hidden></div>

  <section id="practice" aria-label="問題" hidden>
    <ol id="question-list"></ol>
  </section>
</main>
<script src="script.js?v=4"></script>
</body>
</html>
