<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f9">
<title>高校数学 復習問題</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main>
  <header class="site-head">
    <h1>数学の復習</h1>
    <p class="lead">単元と難易度を選んで、最大5問を解いてみよう。</p>
  </header>

  <section id="setup" class="card" aria-label="出題条件">
    <form id="condition-form">
      <fieldset class="field">
        <legend>単元</legend>
        <div id="unit-group" class="chips" role="radiogroup" aria-label="単元"></div>
      </fieldset>
      <fieldset class="field" id="topic-field" hidden>
        <legend>詳細内容</legend>
        <div id="topic-group" class="chips" role="radiogroup" aria-label="詳細内容"></div>
      </fieldset>
      <fieldset class="field">
        <legend>難易度</legend>
        <div id="difficulty-group" class="segmented" role="radiogroup" aria-label="難易度"></div>
      </fieldset>
      <button type="submit" id="fetch-btn" disabled>問題を表示</button>
    </form>
  </section>

  <div id="message" role="status" hidden></div>

  <section id="practice" aria-label="問題" hidden>
    <ol id="question-list"></ol>
  </section>
</main>
<script src="script.js?v=3"></script>
</body>
</html>
